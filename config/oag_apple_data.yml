report_disclosure: |
  Government transfer data (SDRM matched deposits and AgriStability payments)
  was provided by OMAFA (John Cumming) on July 13, 2026, broken out by farm
  type (predominant income) for the 2022-2024 program years. AgriInvest was 
  estimated based on averages provided in the OACC TC Net Income report. Production
  Insurance data is sourced from Agricorp.
  
  For Fresh Table Grapes, government transfers reported by OMAFA for CRA commodity 
  code 83 ($5.40M total in 2024) combine both fresh table and wine/processing grapes.
  Transfers are pro-rated to fresh table grapes using the verified farm gate value share
  of 3.49% ($3.75M table grape FGV / $107.46M total Ontario grape FGV, based on Ontario
  Fresh Grape Growers' Marketing Board data and Grape Growers of Ontario / Statistics Canada
  Table 32-10-0364-01), yielding $0.188M ($188K).
  
  Government transfers are modeled as Induced-only shocks in the IO engine, as they
  generate household spending impacts but do not create supply-chain (Indirect) activity.
