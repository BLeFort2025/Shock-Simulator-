# --- Stage-Specific Fiscal Tax Scalars (2024, Deep Research Verified) ---
fiscal_scalars_2024:
  pit_direct_growing: 0.0452           # 4.52% blended orchard PIT (ITA s. 118.94 SAWP BPA/spousal credits + Ontario LIFT)
  pit_direct_packing: 0.1460           # 14.60% full-time wholesale (NAICS 411) benchmark ($65K avg earnings)
  pit_direct_processing: 0.1388        # 13.88% full-time food mfg (NAICS 3114) benchmark ($55K avg earnings)
  pit_indirect_induced: 0.1231         # 12.31% general Ontario economy effective PIT rate
  cit_direct_growing: 0.0403           # 4.03% of GOS/GMI (0.33 taxable conversion ratio x 12.2% CCPC rate)
  cit_direct_downstream: 0.0780        # 7.80% of GOS (midpoint of 6.80%-8.80% corporate M&P/wholesale benchmark)
  cit_indirect_induced: 0.0549         # 5.49% of GOS (0.45 conversion ratio x 12.2% CCPC rate)
  hst_composite_output: 0.0195         # 1.95% composite value-chain HST (13% on hard cider, <600mL juice, agri-tourism & exempt finance inputs)
  property_tax_per_acre: 75.0          # $75/acre blended orchard rate ($38.35 bare land at 20-25% FT ratio + $36.65 cold storage/SAWP housing)

