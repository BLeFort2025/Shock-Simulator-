    direct_gdp_basic_M: 90.40          # 67.5% of $133.9M FGV (recalibrated from $60.0M grain baseline)
    direct_gdp_market_M: 90.40         # Zero-rated basic groceries at farm gate (Schedule VI, Part III, s. 1)
    direct_gos_M: 21.50                # 16.1% of FGV (positive capital recovery covering orchard CCA & interest)
    direct_taxes_prod_M: 1.50          # 1.1% of FGV ($1.19M municipal orchard property tax + $0.31M licenses)
    direct_emp_social_M: 5.1224        # 7.60% of $67.4M payroll (CPP, EI, and 0.35% small-employer EHT)
    intermediate_inputs_M: 43.50       # 32.5% of FGV (down from $73.90M / 55.2% in grain-dominated NAICS 111A)
    indirect_scale_factor: 0.588633    # $43.50M / $73.90M intermediate input compression ratio
    induced_scale_factor: 3.475        # Midpoint of 3.10x-3.85x remittance-adjusted domestic induced scalar (60% SAWP remittance)
    acres_total: 15850                 # OAG Annual Report / Agricorp total commercial orchard area (bearing + resets)
    acres_bearing_statcan: 14110       # StatCan Table 32-10-0364-01 commercial fruit-bearing area
